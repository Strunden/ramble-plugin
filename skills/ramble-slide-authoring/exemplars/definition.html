<!--
  JOB:   Definition — install a term in the audience's head before you use it.
  WHEN:  The script introduces jargon, a coined product name, or a precise concept
         the viewer must hold for the rest of the ramble.
  ADAPT: .term (the word); .qualifier (italic serif "noun · in our system"); the
         .explanation prose. Shrink .term font for longer terms (see scale below:
         ≤10ch→140px, ≤18ch→104px, else 72px).
  RULES: (1) The explanation is set in IBM Plex Serif — this is the slide where
             prose serif belongs. It reads authoritative, not bullet-y.
         (2) One accent hairline, one term. No second color, no list. Lots of air.
-->
<div style="position:relative;width:1920px;height:1080px;background:#FBFAF7;
  overflow:hidden;font-family:'Inter',system-ui,sans-serif;color:#1A1A1A;
  -webkit-font-smoothing:antialiased">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@500;700;800&family=IBM+Plex+Serif:ital,wght@0,400;1,400&display=swap');
  @keyframes drop{0%{opacity:0;transform:translateY(-32px)}100%{opacity:1;transform:none}}
  @keyframes slide-in{0%{opacity:0;transform:translateX(-40px)}100%{opacity:1;transform:none}}
  .def-wrap{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;padding:0 160px}
  .def-kicker{font-size:25px;font-weight:600;letter-spacing:0.16em;text-transform:uppercase;color:#9A9A9A;margin-bottom:34px;animation:slide-in .4s ease .05s both}
  .def-term{font-weight:800;font-size:140px;line-height:1;letter-spacing:-0.035em;color:#1A1A1A;animation:drop .45s cubic-bezier(.16,1,.3,1) .12s both}
  .def-qual{font-family:'IBM Plex Serif',serif;font-style:italic;font-weight:400;font-size:34px;color:#6B6B6B;margin-top:18px;animation:slide-in .4s ease .3s both}
  .def-rule{width:88px;height:4px;background:#3B5BDB;margin:44px 0;animation:slide-in .4s ease .42s both}
  .def-body{font-family:'IBM Plex Serif',serif;font-weight:400;font-size:52px;line-height:1.45;color:#1A1A1A;max-width:1320px;animation:slide-in .45s ease .52s both}
  .def-body b{font-weight:400;color:#3B5BDB}
</style>
  <div class="def-wrap">
    <div class="def-kicker">The concept</div>
    <div class="def-term">Script-spine</div>
    <div class="def-qual">noun · the model Ramble is built on</div>
    <div class="def-rule"></div>
    <div class="def-body">The written transcript is the single source of truth for the
      video. Slides, the face track, and captions all <b>hang off word ranges</b> in
      that script — edit the words, and the video re-flows.</div>
  </div>
</div>
