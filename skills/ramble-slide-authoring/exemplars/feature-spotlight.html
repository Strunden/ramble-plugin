<!--
  JOB:   Feature spotlight — explain ONE feature: what it is and why it matters.
  WHEN:  The voiceover spends real narration on a single capability (PM solution
         review, designer mock walkthrough). Not for listing several quickly — that's
         the feature-grid.
  ADAPT: [SLOT] the .kicker (the area/surface), the .name (the feature), and the
         .desc serif blurb (1-3 sentences, the BENEFIT not the mechanics).
         IMAGE: replace the <img> src with a /uploads URL or data-URI screenshot.
         If you have NO image, DELETE the whole <figure class="fs-fig"> block and
         change .fs-grid grid-template-columns to "1fr".
  RULES: (1) One feature only. The prose is serif (IBM Plex Serif) — this is where
             editorial serif earns its place; the name is sans (Inter Tight).
         (2) Exactly one accent moment: the kicker rule. The screenshot wears a thin
             frame on a tinted panel — never raw full-bleed.
-->
<div style="position:relative;width:1920px;height:1080px;background:#FBFAF7;
  overflow:hidden;font-family:'Inter',system-ui,sans-serif;color:#1A1A1A;
  -webkit-font-smoothing:antialiased">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Inter+Tight:wght@600;700;800&family=IBM+Plex+Serif:ital,wght@0,400;0,500;1,400&display=swap');
  @keyframes fs-in{0%{opacity:0;transform:translateY(28px)}100%{opacity:1;transform:none}}
  @keyframes fs-fig{0%{opacity:0;transform:translateX(40px)}100%{opacity:1;transform:none}}
  .fs-grid{position:absolute;inset:0;display:grid;grid-template-columns:1fr 0.92fr;align-items:center;gap:96px;padding:0 140px}
  .fs-text{max-width:780px}
  .fs-kicker{display:inline-flex;align-items:center;gap:20px;font-family:'Inter';font-weight:600;font-size:26px;letter-spacing:0.16em;text-transform:uppercase;color:#6B6B6B;margin-bottom:40px;animation:fs-in .5s cubic-bezier(.16,1,.3,1) .05s both}
  .fs-kicker::before{content:"";width:64px;height:3px;background:#3B5BDB;display:inline-block}
  .fs-name{font-family:'Inter Tight';font-weight:800;font-size:104px;line-height:1.02;letter-spacing:-0.035em;color:#1A1A1A;margin-bottom:40px;animation:fs-in .5s cubic-bezier(.16,1,.3,1) .14s both}
  .fs-desc{font-family:'IBM Plex Serif';font-weight:400;font-size:40px;line-height:1.5;color:#3A3A3A;animation:fs-in .5s cubic-bezier(.16,1,.3,1) .24s both}
  .fs-desc em{font-style:normal;color:#3B5BDB}
  .fs-fig{margin:0;animation:fs-fig .6s cubic-bezier(.16,1,.3,1) .32s both}
  .fs-panel{background:color-mix(in srgb,#3B5BDB 6%,#FBFAF7);border:1px solid #E5E5E5;border-radius:18px;padding:36px;display:flex;align-items:center;justify-content:center}
  .fs-panel img{width:100%;display:block;border-radius:8px;border:1px solid #E5E5E5}
  .fs-cap{font-family:'Inter';font-weight:500;font-size:24px;color:#9A9A9A;margin-top:24px;letter-spacing:0.02em}
</style>
  <div class="fs-grid">
    <div class="fs-text">
      <div class="fs-kicker">Capture surface</div>
      <div class="fs-name">One-take<br>face recording</div>
      <div class="fs-desc">Read your script straight off the transcript teleprompter while the camera rolls. The take lands <em>in sync with the slides</em> — no separate edit pass, no re-timing.</div>
    </div>
    <figure class="fs-fig">
      <div class="fs-panel">
        <!-- SWAP image-1: replace src with a data-URI (preferred, export-safe) or /uploads URL via ramble_add_media. NEVER hotlink remote http(s). Default below is a flat inline-SVG mock. -->
        <img data-slot="image-1" src="data:image/svg+xml;utf8,&lt;svg xmlns='http://www.w3.org/2000/svg' width='720' height='460'&gt;&lt;rect width='720' height='460' fill='%23FFFFFF'/&gt;&lt;rect x='1' y='1' width='718' height='64' fill='%23FBFAF7'/&gt;&lt;circle cx='34' cy='33' r='7' fill='%23E5E5E5'/&gt;&lt;circle cx='58' cy='33' r='7' fill='%23E5E5E5'/&gt;&lt;circle cx='82' cy='33' r='7' fill='%23E5E5E5'/&gt;&lt;rect x='150' y='22' width='420' height='22' rx='11' fill='%23F0EFEA'/&gt;&lt;circle cx='600' cy='360' r='78' fill='none' stroke='%233B5BDB' stroke-width='4'/&gt;&lt;rect x='90' y='120' width='320' height='18' rx='9' fill='%23E9E8E3'/&gt;&lt;rect x='90' y='160' width='420' height='18' rx='9' fill='%23E9E8E3'/&gt;&lt;rect x='90' y='200' width='260' height='18' rx='9' fill='%233B5BDB' opacity='0.5'/&gt;&lt;/svg&gt;" alt="Recording UI" />
      </div>
      <figcaption class="fs-cap">Teleprompter + camera, one surface</figcaption>
    </figure>
  </div>
</div>
